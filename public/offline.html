<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · DayBloom</title>
    <!--
      Shown by public/sw.js when a page can't load offline. Self-contained
      (no app CSS or JS is cached), so colours mirror the tokens in
      src/app/globals.css, and the theme follows the saved choice
      (src/lib/theme.ts, key "daybloom-theme").
    -->
    <script>
      ;(function () {
        var p = "system"
        try {
          p = localStorage.getItem("daybloom-theme") || "system"
        } catch (e) {}
        var dark =
          p === "dark" ||
          (p === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.className = dark ? "dark" : ""
      })()
    </script>
    <style>
      :root {
        color-scheme: light;
        --background: #f3f7f5;
        --foreground: #0f2219;
        --muted-foreground: #4d6358;
        --primary: #047857;
        --primary-foreground: #ffffff;
        --border: #dce7e0;
        --ring: rgba(4, 120, 87, 0.5);
      }
      :root.dark {
        color-scheme: dark;
        --background: #06120d;
        --foreground: #e6f2ec;
        --muted-foreground: #93ab9f;
        --primary: #34d399;
        --primary-foreground: #022c1e;
        --border: #1b392c;
        --ring: rgba(52, 211, 153, 0.5);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 22rem;
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0f766e, #047857 58%, #166534);
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted-foreground);
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"
          />
          <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" />
          <path d="M5 21h14" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        DayBloom needs a connection to load your day. Your data is safe; check
        your connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
